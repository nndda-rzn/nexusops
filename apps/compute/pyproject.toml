[project]
name = "nexusops-compute"
version = "0.1.0"
description = "NexusOps Python Compute & Optimization Engine"
requires-python = ">=3.12"
dependencies = [
    "ortools>=9.12",
    "networkx>=3.4",
    "pandas>=2.2",
    "geopandas>=1.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.3",
    "redis>=5.2",
    "shapely>=2.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.8",
    "structlog>=25.1",
    "uvicorn>=0.34",
    "fastapi>=0.115",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
